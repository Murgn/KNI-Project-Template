<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>loading</title>
    <base href="./">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="stylesheet" href="css/style.css">

    <script>
        (function()
        {
            window._audioContexts = [];
            var NativeAudioContext = window.AudioContext || window.webkitAudioContext;
            if (NativeAudioContext)
            {
                var PatchedAudioContext = function(...args)
                {
                    var ctx = new NativeAudioContext(...args);
                    window._audioContexts.push(ctx);
                    return ctx;
                };
                PatchedAudioContext.prototype = NativeAudioContext.prototype;
                window.AudioContext = PatchedAudioContext;
                window.webkitAudioContext = PatchedAudioContext;
            }

            function resumeAllAudioContexts()
            {
                window._audioContexts.forEach(function(ctx)
                {
                    if (ctx.state === "suspended")
                        ctx.resume();
                });
            }

            ["click", "touchstart", "keydown"].forEach(function(evt)
            {
                window.addEventListener(evt, resumeAllAudioContexts, { once: true });
            });
        })();
    </script>

</head>

<body>

    <div id="app">
        <div id="loading">loading<span id="dots"></span></div>
    </div>
    
    <script>
        const dots = document.getElementById("dots");
        let count = 0;
    
        setInterval(() => {
            count = (count + 1) % 4;
            dots.textContent = ".".repeat(count);
        }, 250);
    </script>
    
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>
